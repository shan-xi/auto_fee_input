name: package-macos

# Triggers:
#   - push a tag like v1.0.0   -> auto build + attach .dmg to a Release
#   - manual "Run workflow"     -> just produces the .dmg as a workflow artifact
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build-macos-dmg:
    # arm64 runner; the produced .app/.dmg is aarch64-only.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build .dmg
        run: ./package-macos.sh dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFeeInput-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach to Release (only when triggered by a tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg